name: Private Collection Market Pipeline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject tracked local environment files
        shell: bash
        run: |
          set -euo pipefail
          tracked_env_files=""
          while IFS= read -r file; do
            base="$(basename "$file")"
            case "$base" in
              .env|.env.local|.env.development|.env.production|.env.staging|.env.test)
                tracked_env_files+="$file"$'\n'
                ;;
            esac
          done < <(git ls-files)

          if [[ -n "$tracked_env_files" ]]; then
            echo "Tracked environment files are prohibited:"
            printf '%s' "$tracked_env_files"
            exit 1
          fi

      - name: Reject obvious SportsCardsPro credentials
        shell: bash
        run: |
          set -euo pipefail
          matches="$(grep -RInE \
            --exclude-dir=.git \
            --exclude='*.md' \
            --exclude='.env.example' \
            --exclude='package-lock.json' \
            '(SPORTSCARDSPRO_API_(TOKEN|KEY)[[:space:]]*=[[:space:]]*[a-fA-F0-9]{40}|[?&]t=[a-fA-F0-9]{40})' \
            . || true)"
          if [[ -n "$matches" ]]; then
            echo "Potential SportsCardsPro credential committed:"
            echo "$matches" | sed -E 's/[a-fA-F0-9]{40}/[REDACTED]/g'
            exit 1
          fi

      - name: Verify private artifacts are not tracked
        shell: bash
        run: |
          set -euo pipefail
          prohibited="$(git ls-files | grep -E '(private/images|ACoolCOLLECTION_100_Item_Drive_Manifest\.(json|csv)|listing_candidates\.(json|csv)|earnings_scenario\.json|provider_sync_results\.json)' || true)"
          if [[ -n "$prohibited" ]]; then
            echo "Private collection artifact is tracked:"
            echo "$prohibited"
            exit 1
          fi

  pipeline-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/sportscardspro_pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall .
      - name: Test
        run: python -m unittest -v test_pipeline.py

  omni-engine-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/omni-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/omni-engine/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript build
        run: npm run build
