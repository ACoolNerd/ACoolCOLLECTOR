services:

  # ============================================================
  # LAYER 0 — INFRASTRUCTURE
  # Stateful services. Data lives in named Docker volumes.
  # ============================================================

  db:
    image: postgres:15-alpine
    container_name: acool_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - acool-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: acool_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - acool-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # LAYER 1 — APPLICATION
  # Project-specific services built from local Dockerfiles.
  # ============================================================

  ai-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acool_ai_engine
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      PYTHONUNBUFFERED: 1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - acool-network
    volumes:
      - ./:/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: acool_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    networks:
      - acool-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # LAYER 2 — DEVELOPER TOOLS
  # Localhost-only. Start with: docker compose --profile tools up -d
  # Or start everything: docker compose up -d (tools always start)
  # ============================================================

  portainer:
    image: portainer/portainer-ce:latest
    container_name: acool_portainer
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - acool-network

  adminer:
    image: adminer:4
    container_name: acool_adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      db:
        condition: service_healthy
    networks:
      - acool-network

  portainer-agent:
    image: portainer/agent:2.45.2
    container_name: acool_portainer_agent
    restart: always
    ports:
      - "9001:9001"
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
      - /:/host
    networks:
      - acool-network

  # ============================================================
  # LAYER 3 — REVERSE PROXY
  # Uncomment when you have 3+ web services to unify.
  # Routes all services via clean URLs instead of raw ports.
  # Dashboard: http://localhost:8088
  # Web service example: http://web.localhost → port 3000
  # API example:         http://api.localhost → port 8000
  # ============================================================

  # traefik:
  #   image: traefik:v3
  #   container_name: acool_traefik
  #   restart: always
  #   command:
  #     - "--api.insecure=true"
  #     - "--providers.docker=true"
  #     - "--providers.docker.exposedbydefault=false"
  #     - "--entrypoints.web.address=:80"
  #   ports:
  #     - "80:80"
  #     - "8088:8080"
  #   volumes:
  #     - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
  #   networks:
  #     - acool-network
  #
  # To expose a service through Traefik, add these labels to it:
  #   labels:
  #     - "traefik.enable=true"
  #     - "traefik.http.routers.web.rule=Host(`web.localhost`)"
  #     - "traefik.http.routers.web.entrypoints=web"
  #     - "traefik.http.services.web.loadbalancer.server.port=3000"

networks:
  acool-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  portainer_data:
    driver: local
